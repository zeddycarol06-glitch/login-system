<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEDTECH | Send Message</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0">
    <link rel="stylesheet" href="style.css">
    <script src="dashboard.js" defer></script>
</head>
<body class="dashboard-body">

    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/1.png" alt="ZEDTECH logo" class="logo-img">
            </a>
            <a href="index.html" class="back-home-btn">
                <span class="material-symbols-rounded">arrow_back</span>
                Back to Home
            </a>
        </nav>
    </header>

    <!-- DASHBOARD CONTENT -->
    <main class="dashboard-main">
        <div class="dashboard-container">
            <h1>Send a Message</h1>
            <p class="dashboard-subtitle">Choose how you'd like to reach us</p>

            <!-- TAB SWITCHER -->
            <div class="tab-switcher">
                <button class="tab-btn active" data-tab="email">
                    <span class="material-symbols-rounded">mail</span>
                    Email
                </button>
                <button class="tab-btn" data-tab="whatsapp">
                    <span class="material-symbols-rounded">chat</span>
                    WhatsApp
                </button>
            </div>

            <!-- EMAIL FORM -->
            <div class="tab-content active" id="email-tab">
                <form id="email-form" class="messenger-form">
                    <div class="input-field">
                        <input type="text" id="email-name" required>
                        <label>Your Name</label>
                    </div>
                    <div class="input-field">
                        <input type="email" id="email-sender" required>
                        <label>Your Email</label>
                    </div>
                    <div class="input-field">
                        <input type="text" id="email-subject" required>
                        <label>Subject</label>
                    </div>
                    <div class="input-field textarea-field">
                        <textarea id="email-message" rows="5" required></textarea>
                        <label>Your Message</label>
                    </div>
                    <button type="submit" class="send-btn">
                        <span class="material-symbols-rounded">send</span>
                        Send via Email
                    </button>
                </form>
            </div>

            <!-- WHATSAPP FORM -->
            <div class="tab-content" id="whatsapp-tab">
                <form id="whatsapp-form" class="messenger-form">
                    <div class="input-field">
                        <input type="text" id="wa-name" required>
                        <label>Your Name</label>
                    </div>
                    <div class="input-field textarea-field">
                        <textarea id="wa-message" rows="5" required></textarea>
                        <label>Your Message</label>
                    </div>
                    <button type="submit" class="send-btn wa-btn">
                        <span class="material-symbols-rounded">chat</span>
                        Send via WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
